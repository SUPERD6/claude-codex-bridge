name: tests
# A push to a branch runs a small set (Linux 3.11 + 3.13, Windows 3.11, one package check): on a private repo every
# minute is billed, macOS at 10x and Windows at 2x; the full matrix on every push most likely used up the free
# minutes in October 2026 (jobs stopped starting: "spending limit"). The full matrix (3 OS x 3.11-3.13, package on 3 OS) runs on version tags, pull requests and by hand.
# Pushes that only touch docs don't run.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "site/**", "LICENSE"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.p.outputs.full }}
    steps:
      - id: p
        run: echo "full=${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        full: ["${{ needs.plan.outputs.full }}"]
        exclude:
          - {full: "false", os: macos-latest}
          - {full: "false", os: windows-latest, python: "3.12"}
          - {full: "false", os: windows-latest, python: "3.13"}
          - {full: "false", os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (tests create repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
        env:
          PYTHONUTF8: "1"

  package:
    # build the wheel, install it into a clean venv outside the source tree, run the installed ccx
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        full: ["${{ needs.plan.outputs.full }}"]
        exclude:
          - {full: "false", os: macos-latest}
          - {full: "false", os: windows-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --outdir dist          # wheel + sdist, what an upload to PyPI would carry
      - run: python -m twine check --strict dist/*  # the long description (README.md) renders on PyPI
      - name: install into a clean venv and smoke-test
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then B="$RUNNER_TEMP/venv/Scripts"; else B="$RUNNER_TEMP/venv/bin"; fi
          "$B/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && "$B/python" "$GITHUB_WORKSPACE/tests/smoke_installed.py" "$B/ccx"

name: tests
# A pull request runs a small set: Windows 3.11 and Ubuntu 3.13 (the oldest Python on the OS every real run used, the
# newest on Linux), plus the package check on Ubuntu. A push to main, a version tag and a run by hand run the full
# matrix (3 OS x 3.11-3.13, package on 3 OS), so whatever a pull request did not cover is checked once it lands.
# Why: on a private repo every minute is billed (macOS 10x, Windows 2x); the full matrix on every push most likely used
# up the free minutes in October 2026 (jobs stopped starting: "spending limit"), and a PR is pushed several times.
# Pushes to other branches don't run (their pull request does), nor pushes to main that only touch docs.
# Job names carry no "full" flag, so a PR check and the same cell on main have the same name.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "site/**", "LICENSE"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # every main commit keeps its full run
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.p.outputs.test }}
      package: ${{ steps.p.outputs.package }}
    steps:
      - id: p
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo 'test={"include":[{"os":"windows-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.13"}]}' >> "$GITHUB_OUTPUT"
            echo 'package={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'test={"os":["ubuntu-latest","windows-latest","macos-latest"],"python":["3.11","3.12","3.13"]}' >> "$GITHUB_OUTPUT"
            echo 'package={"os":["ubuntu-latest","windows-latest","macos-latest"]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (tests create repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
        env:
          PYTHONUTF8: "1"

  package:
    # build the wheel, install it into a clean venv outside the source tree, run the installed ccx
    needs: plan
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - name: install into a clean venv and smoke-test
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then B="$RUNNER_TEMP/venv/Scripts"; else B="$RUNNER_TEMP/venv/bin"; fi
          "$B/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && "$B/python" "$GITHUB_WORKSPACE/tests/smoke_installed.py" "$B/ccx"

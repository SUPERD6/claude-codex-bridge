name: Idea or feature
description: Something ccx should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [delegation, routing / cost, memory / handoff, setup / sync, dashboard, new agent adapter, docs, other]

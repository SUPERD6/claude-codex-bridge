<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">ccx — Claude Code and Codex hand work to each other</title>
  <desc id="d">Claude Code hands a task to Codex; ccx routes it to a small model, Codex finishes in one attempt, and the result is verified at a cost of $0.0023 (a real run).</desc>
  <rect width="1200" height="340" rx="16" fill="#f6f7f9"/>
  <g font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">
    <text x="64" y="122" font-size="84" font-weight="700" fill="#1c2129">ccx</text>
  </g>
  <g font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">
    <text x="64" y="178" font-size="30" font-weight="600" fill="#1c2129">Claude Code ⇄ Codex,</text>
    <text x="64" y="216" font-size="30" font-weight="600" fill="#1c2129">each other's sub-agent</text>
    <text x="64" y="262" font-size="21" fill="#5b6573">The cheapest model likely to finish each piece —</text>
    <text x="64" y="292" font-size="21" fill="#5b6573">checked, and with the receipt.</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">
    <rect x="640" y="32" width="512" height="276" rx="12" fill="#ffffff" stroke="#d8dce3"/>
    <rect x="672" y="58" width="300" height="44" rx="8" fill="#b4690e"/>
    <text x="692" y="88" font-size="21" font-weight="600" fill="#ffffff">Claude Code · lead</text>
    <path d="M700 102 V 138 M692 130 L700 140 L708 130" stroke="#8b95a3" stroke-width="2.5" fill="none"/>
    <text x="724" y="128" font-size="18" fill="#5b6573">route b=2 → luna · low · p 0.95</text>
    <rect x="672" y="146" width="380" height="44" rx="8" fill="#0f7c80"/>
    <text x="692" y="176" font-size="21" font-weight="600" fill="#ffffff">Codex · done, 1 attempt</text>
    <path d="M700 190 V 226 M692 218 L700 228 L708 218" stroke="#8b95a3" stroke-width="2.5" fill="none"/>
    <text x="724" y="216" font-size="18" fill="#5b6573">you check the diff</text>
    <text x="672" y="268" font-size="24" font-weight="700" fill="#1f7a3a">✓ verified</text>
    <text x="860" y="268" font-size="24" font-weight="700" fill="#1c2129">$0.0023</text>
    <text x="990" y="268" font-size="17" fill="#5b6573">real run</text>
  </g>
</svg>

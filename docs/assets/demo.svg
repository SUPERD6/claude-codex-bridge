<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 920 488" width="920" height="488" role="img" aria-labelledby="t d">
  <title id="t">ccx demo: a hand-off and its receipt</title>
  <desc id="d">An animated terminal: ccx route picks a model, ccx run hands the task from Claude Code to Codex and it is done in one attempt; the receipt shows the check ccx ran again, another vendor's review and the cost; ccx ui shows the same receipt on its page. Generated by scripts/make_demo.py with stand-in CLIs.</desc>
  <style>
    text,g{opacity:0;animation-duration:15.0s;animation-iteration-count:infinite;animation-timing-function:step-end}
    text{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;font-size:15px;white-space:pre}
    g text,text.ui{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;opacity:1;animation:none}
    text.ui[style]{opacity:0;animation-duration:15.0s;animation-iteration-count:infinite;animation-timing-function:step-end}
    .static{opacity:1;animation:none}
    @media (prefers-reduced-motion: reduce){text,g,text.ui[style]{opacity:1;animation:none}}
  </style>
  <rect width="920" height="488" rx="12" fill="#11161c"/>
  <circle cx="26" cy="24" r="6" fill="#3b434d"/><circle cx="46" cy="24" r="6" fill="#3b434d"/><circle cx="66" cy="24" r="6" fill="#3b434d"/>
  <text class="static" x="896" y="29" text-anchor="end" fill="#7f8996" font-size="13">demo · stand-in CLIs, made-up costs · scripts/make_demo.py</text>
  <line x1="0" y1="44" x2="920" y2="44" stroke="#222a33"/>
  <text x="28" y="74" fill="#d9dee5" style="animation-name:k0"><tspan fill="#7f8996">$ </tspan>ccx route --to codex --b 2</text>
  <style>@keyframes k0{0%,0.00%{opacity:0}0.50%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="100" fill="#aab3bf" style="animation-name:k1">  codex:gpt-6-luna:low   likely to finish 80%</text>
  <style>@keyframes k1{0%,5.67%{opacity:0}6.17%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="152" fill="#d9dee5" style="animation-name:k2"><tspan fill="#7f8996">$ </tspan>ccx run --to codex --b 2 --check &quot;python -m unittest -q&quot; --review on &quot;Add slugify() with a test&quot;</text>
  <style>@keyframes k2{0%,11.33%{opacity:0}11.83%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="178" fill="#aab3bf" style="animation-name:k3">  claude → codex  gpt-6-luna low · 1 attempt · done</text>
  <style>@keyframes k3{0%,17.00%{opacity:0}17.50%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="204" fill="#7f8996" style="animation-name:k4">  receipt</text>
  <style>@keyframes k4{0%,22.67%{opacity:0}23.17%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="230" fill="#58c27a" style="animation-name:k5">    check    python -m unittest -q  rerun by ccx: passed</text>
  <style>@keyframes k5{0%,28.33%{opacity:0}28.83%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="256" fill="#58c27a" style="animation-name:k6">    review   claude haiku low (another vendor): pass</text>
  <style>@keyframes k6{0%,34.00%{opacity:0}34.50%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="282" fill="#aab3bf" style="animation-name:k7">    cost     $0.0003 (stand-in price), review included · undo: ccx undo &lt;run&gt;</text>
  <style>@keyframes k7{0%,39.67%{opacity:0}40.17%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="334" fill="#d9dee5" style="animation-name:k8"><tspan fill="#7f8996">$ </tspan>ccx ui</text>
  <style>@keyframes k8{0%,45.33%{opacity:0}45.83%,97%{opacity:1}100%{opacity:0}}</style>
  <g style="animation-name:c9"><rect x="28" y="344" width="560" height="106" rx="8" fill="#f6f7f9" stroke="#d8dce3"/><text class="ui" x="44" y="370" font-weight="700" fill="#1c2129">Add slugify() with a test</text><text class="ui" x="572" y="370" text-anchor="end" fill="#1f7a3a">✓ done</text><text class="ui" x="44" y="394" fill="#5b6573">Who  Codex · gpt-6-luna low     Cost  $0.0003</text><text class="ui" x="44" y="416" fill="#5b6573">Check  python -m unittest -q · passed</text><text class="ui" x="44" y="438" fill="#5b6573">Review  pass · claude · haiku · low     Verdict  right (yours)</text></g>
  <text class="ui" x="606" y="394" fill="#aab3bf" style="animation-name:c9">← the same receipt,</text>
  <text class="ui" x="606" y="416" fill="#aab3bf" style="animation-name:c9">every hand-off, one page</text>
  <style>@keyframes c9{0%,51.00%{opacity:0}51.50%,97%{opacity:1}100%{opacity:0}}</style>
</svg>

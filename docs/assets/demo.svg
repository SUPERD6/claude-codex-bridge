<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 920 364" width="920" height="364" role="img" aria-labelledby="t d">
  <title id="t">ccx demo: route, run, verify</title>
  <desc id="d">An animated terminal: ccx picks a model for a task, runs it on Codex, and records the verdict. Generated by scripts/make_demo.py with stand-in CLIs.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;font-size:15px;white-space:pre;
          opacity:0;animation-duration:13.0s;animation-iteration-count:infinite;animation-timing-function:step-end}
    .static{opacity:1;animation:none}
    @media (prefers-reduced-motion: reduce){text{opacity:1;animation:none}}
  </style>
  <rect width="920" height="364" rx="12" fill="#11161c"/>
  <circle cx="26" cy="24" r="6" fill="#3b434d"/><circle cx="46" cy="24" r="6" fill="#3b434d"/><circle cx="66" cy="24" r="6" fill="#3b434d"/>
  <text class="static" x="896" y="29" text-anchor="end" fill="#7f8996" font-size="13">demo · stand-in CLIs · scripts/make_demo.py</text>
  <line x1="0" y1="44" x2="920" y2="44" stroke="#222a33"/>
  <text x="28" y="74" fill="#d9dee5" style="animation-name:k1"><tspan fill="#7f8996">$ </tspan>ccx route --to codex --b 2</text>
  <style>@keyframes k1{0%,0.00%{opacity:0}0.50%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="100" fill="#aab3bf" style="animation-name:k2">  codex:gpt-6-luna:low   p 0.65 · with escalation 0.95</text>
  <style>@keyframes k2{0%,6.92%{opacity:0}7.42%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="152" fill="#d9dee5" style="animation-name:k3"><tspan fill="#7f8996">$ </tspan>ccx run --to codex --mode read &quot;Read README.md and report its first line&quot;</text>
  <style>@keyframes k3{0%,13.85%{opacity:0}14.35%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="178" fill="#aab3bf" style="animation-name:k4">  claude → codex   luna/low · 1 attempt</text>
  <style>@keyframes k4{0%,20.77%{opacity:0}21.27%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="204" fill="#58c27a" style="animation-name:k5">  status   done</text>
  <style>@keyframes k5{0%,27.69%{opacity:0}28.19%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="230" fill="#aab3bf" style="animation-name:k6">  tokens   1,200 in · 150 out · $0.0001</text>
  <style>@keyframes k6{0%,34.62%{opacity:0}35.12%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="282" fill="#d9dee5" style="animation-name:k7"><tspan fill="#7f8996">$ </tspan>ccx verify 20261023-233928-c47a --ok 1</text>
  <style>@keyframes k7{0%,41.54%{opacity:0}42.04%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="308" fill="#58c27a" style="animation-name:k8">  ✓ recorded — routing learns from it</text>
  <style>@keyframes k8{0%,48.46%{opacity:0}48.96%,97%{opacity:1}100%{opacity:0}}</style>
</svg>

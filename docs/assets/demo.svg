<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 920 390" width="920" height="390" role="img" aria-labelledby="t d">
  <title id="t">ccx demo: route, run, check, verify</title>
  <desc id="d">An animated terminal: ccx picks a model for a task, runs it on Codex, reruns the check, and records the verdict. Generated by scripts/make_demo.py with stand-in CLIs.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;font-size:15px;white-space:pre;
          opacity:0;animation-duration:13.9s;animation-iteration-count:infinite;animation-timing-function:step-end}
    .static{opacity:1;animation:none}
    @media (prefers-reduced-motion: reduce){text{opacity:1;animation:none}}
  </style>
  <rect width="920" height="390" rx="12" fill="#11161c"/>
  <circle cx="26" cy="24" r="6" fill="#3b434d"/><circle cx="46" cy="24" r="6" fill="#3b434d"/><circle cx="66" cy="24" r="6" fill="#3b434d"/>
  <text class="static" x="896" y="29" text-anchor="end" fill="#7f8996" font-size="13">demo · stand-in CLIs · scripts/make_demo.py</text>
  <line x1="0" y1="44" x2="920" y2="44" stroke="#222a33"/>
  <text x="28" y="74" fill="#d9dee5" style="animation-name:k1"><tspan fill="#7f8996">$ </tspan>ccx route --to codex --b 2</text>
  <style>@keyframes k1{0%,0.00%{opacity:0}0.50%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="100" fill="#aab3bf" style="animation-name:k2">  codex:gpt-6.1-sol:medium   p 0.98 · with escalation 1.00</text>
  <style>@keyframes k2{0%,6.47%{opacity:0}6.97%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="152" fill="#d9dee5" style="animation-name:k3"><tspan fill="#7f8996">$ </tspan>ccx run --to codex --b 2 --check &quot;pytest -q&quot; &quot;Add a slugify() helper with a test&quot;</text>
  <style>@keyframes k3{0%,12.95%{opacity:0}13.45%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="178" fill="#aab3bf" style="animation-name:k4">  claude → codex   gpt-6.1-sol/medium · 1 attempt</text>
  <style>@keyframes k4{0%,19.42%{opacity:0}19.92%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="204" fill="#58c27a" style="animation-name:k5">  status   done · files a.py</text>
  <style>@keyframes k5{0%,25.90%{opacity:0}26.40%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="230" fill="#58c27a" style="animation-name:k6">  check    rerun by ccx: passed</text>
  <style>@keyframes k6{0%,32.37%{opacity:0}32.87%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="256" fill="#aab3bf" style="animation-name:k7">  tokens   1,200 in · 150 out · $0.0024</text>
  <style>@keyframes k7{0%,38.85%{opacity:0}39.35%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="308" fill="#d9dee5" style="animation-name:k8"><tspan fill="#7f8996">$ </tspan>ccx verify 20261024-194143-2f82 --ok 1</text>
  <style>@keyframes k8{0%,45.32%{opacity:0}45.82%,97%{opacity:1}100%{opacity:0}}</style>
  <text x="28" y="334" fill="#58c27a" style="animation-name:k9">  ✓ recorded — routing learns from it (no verdict in 12 h: ccx records a probable one)</text>
  <style>@keyframes k9{0%,51.80%{opacity:0}52.30%,97%{opacity:1}100%{opacity:0}}</style>
</svg>

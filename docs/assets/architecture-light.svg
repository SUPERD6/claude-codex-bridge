<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">How ccx connects the agent CLIs, your hub, the project and the local page</title>
  <desc id="d">Claude Code, Codex and Gemini CLI each connect to ccx; any of them can lead and hand a brief to another, which runs headless and returns JSON. ccx routes, reruns the check, asks another vendor to review, records verdicts and costs. Below: the personal layer (your hub: memory, skills, MCP, ledger), the project layer (.ccx: context, journal, handoffs, checkpoints, undo snapshots) and ccx ui, a local read-only page.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b95a3"/></marker></defs>
  <rect width="1200" height="660" rx="16" fill="#f6f7f9"/>
  <rect x="40" y="40" width="350" height="130" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <rect x="40" y="40" width="6" height="130" rx="3" fill="#b4690e"/>
  <text x="62" y="72" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Claude Code</text>
  <text x="62" y="100" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">lead or worker</text>
  <text x="62" y="124" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">DeepSeek through it: optional</text>
  <rect x="425" y="40" width="350" height="130" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <rect x="425" y="40" width="6" height="130" rx="3" fill="#0f7c80"/>
  <text x="447" y="72" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Codex</text>
  <text x="447" y="100" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">lead or worker</text>
  <text x="447" y="124" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">terminal / desktop app</text>
  <rect x="810" y="40" width="350" height="130" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <rect x="810" y="40" width="6" height="130" rx="3" fill="#6e4fc4"/>
  <text x="832" y="72" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Gemini CLI</text>
  <text x="832" y="100" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">worker (adapter; not run live)</text>
  <text x="832" y="124" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">one adapter per CLI</text>
  <rect x="200" y="250" width="800" height="150" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <text x="222" y="282" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">ccx</text>
  <text x="222" y="310" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">route → agent:model:effort · or “do it yourself”</text>
  <text x="222" y="334" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">run → headless, JSON back · check rerun · other-vendor review</text>
  <text x="222" y="358" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">verify / auto verdicts → routing learns · ledger · ccx lead</text>
  <rect x="40" y="480" width="350" height="140" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <text x="62" y="512" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Personal layer · your hub</text>
  <text x="62" y="540" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">memory snapshot + journal</text>

  <rect x="425" y="480" width="350" height="140" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <text x="447" y="512" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Project layer · .ccx/</text>
  <text x="447" y="540" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">context.md · journal · inbox</text>
  <text x="447" y="564" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">handoffs · checkpoints</text>
  <text x="447" y="588" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">undo snapshots · queue</text>
  <rect x="810" y="480" width="350" height="140" rx="10" fill="#ffffff" stroke="#d8dce3"/>
  <text x="832" y="512" font-size="19" font-weight="600" fill="#1c2129" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">ccx ui · local page</text>
  <text x="832" y="540" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">127.0.0.1, read-only, no model</text>
  <text x="832" y="564" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">what waits for you · who works</text>
  <text x="832" y="588" font-size="15" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">quota at this pace</text>

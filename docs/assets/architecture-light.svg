  <text x="450" y="456" font-size="14" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace" text-anchor="middle">new memory · handoffs</text>
  <text x="900" y="445" font-size="14" fill="#5b6573" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace" dx="12">reads files only</text>

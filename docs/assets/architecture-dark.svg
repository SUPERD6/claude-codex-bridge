<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
  <title id="t">How ccx connects Claude Code, Codex, your hub and the project</title>
  <desc id="d">Either tool leads; ccx routes a brief to the other tool, runs it headless and returns a JSON result. A session-start hook brings new memory, handoffs and unfinished tasks from your personal hub; skills and MCP are linked into both tools; the project's .ccx folder holds context, journal, inbox, handoff, checkpoints and undo snapshots.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6b7684"/></marker></defs>
  <rect width="1200" height="540" rx="16" fill="#0f1318"/>
  <rect x="40" y="40" width="290" height="150" rx="10" fill="#161b22" stroke="#2b323c"/>
  <rect x="40" y="40" width="6" height="150" rx="3" fill="#e3a14e"/>
  <text x="62" y="72" font-size="19" font-weight="600" fill="#e7ebf0" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Claude Code</text>
  <text x="62" y="100" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">lead or sub-agent</text>
  <text x="62" y="124" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">terminal / desktop app</text>
  <rect x="870" y="40" width="290" height="150" rx="10" fill="#161b22" stroke="#2b323c"/>
  <rect x="870" y="40" width="6" height="150" rx="3" fill="#4cc3c6"/>
  <text x="892" y="72" font-size="19" font-weight="600" fill="#e7ebf0" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Codex</text>
  <text x="892" y="100" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">lead or sub-agent</text>
  <text x="892" y="124" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">Gemini CLI: optional</text>
  <rect x="450" y="40" width="300" height="150" rx="10" fill="#161b22" stroke="#2b323c"/>
  <text x="472" y="72" font-size="19" font-weight="600" fill="#e7ebf0" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">ccx</text>
  <text x="472" y="100" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">route → agent:model:effort</text>
  <text x="472" y="124" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">run → headless, JSON back</text>
  <text x="472" y="148" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">verify → routing learns</text>
  <text x="472" y="172" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">writes the ledger</text>
  <rect x="40" y="300" width="520" height="200" rx="10" fill="#161b22" stroke="#2b323c"/>
  <text x="62" y="332" font-size="19" font-weight="600" fill="#e7ebf0" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Your hub · personal, never in the repo</text>
  <text x="62" y="360" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">memory snapshot + journal</text>
  <text x="62" y="384" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">skills · MCP registry</text>
  <text x="62" y="408" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">ledger · learned estimates</text>
  <text x="62" y="432" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">settings · archived sessions</text>
  <rect x="640" y="300" width="520" height="200" rx="10" fill="#161b22" stroke="#2b323c"/>
  <text x="662" y="332" font-size="19" font-weight="600" fill="#e7ebf0" font-family="-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">Project · &lt;project&gt;/.ccx/</text>
  <text x="662" y="360" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">context.md — every sub-agent reads it</text>
  <text x="662" y="384" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">journal · inbox · handoff</text>
  <text x="662" y="408" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">tasks/ — checkpoints for resuming</text>
  <text x="662" y="432" font-size="15" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace">read by whichever agent works here</text>

  <path d="M750 90 H 868" stroke="#6b7684" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="809" y="80" font-size="14" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace" text-anchor="middle">run</text>
  <path d="M868 140 H 752" stroke="#6b7684" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="809" y="162" font-size="14" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace" text-anchor="middle">JSON</text>
  <path d="M185 298 V 192" stroke="#6b7684" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M420 298 V 245 H 1015 V 192" stroke="#6b7684" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="718" y="236" font-size="14" fill="#97a1ae" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Menlo,Consolas,monospace" text-anchor="middle">to both tools: session-start hook · skills · MCP</text>
